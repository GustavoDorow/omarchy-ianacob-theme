# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

general {
    # A uniform, subtle focus border at 20% white.
    col.active_border = rgba(ffffff33)
    col.inactive_border = rgb(05080a)
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

# A lone tiled window uses half the theme's normal gaps and keeps its rounding.
workspace = w[tv1], gapsin:2, gapsout:4

# A lone tiled window does not need a focus indicator.
windowrule = border_size 0, match:float 0, match:workspace w[tv1]

# Fullscreen windows should meet every monitor edge without a visible frame.
windowrule {
    name = lasthorizon-fullscreen-edge-to-edge
    match:fullscreen = true
    border_size = 0
    rounding = 0
    no_shadow = true
}

group {
    col.border_active = rgba(ffffff33)
    col.border_inactive = rgb(141719)
}


decoration {
    rounding = 9
    rounding_power = 4
    blur {
      enabled = true
      size = 12
      passes = 3
      ignore_opacity = true
      new_optimizations = true
      xray = false
      noise = 0.02
      contrast = 0.92
      brightness = 0.82
      vibrancy = 0.20
      vibrancy_darkness = 0.15
    }
    shadow {
      enabled = yes
      render_power = 6
      range = 20
      color = rgba(05080a99)
    }
}

# Blur the Quickshell Omarchy Menu and clipboard surfaces. The low alpha
# cutoff keeps their transparent full-screen scrims clear while blurring the cards.
layerrule {
    name = lasthorizon-omarchy-menu-surfaces
    blur = true
    ignore_alpha = 0.10
    xray = false
    match:namespace = ^(omarchy-menu|omarchy-clipboard)$
}

animations {
    enabled = true
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 0
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}
